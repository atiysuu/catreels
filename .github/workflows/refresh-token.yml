name: Instagram tokenini yenile

# Uzun omurlu token 60 gunde doluyor. Haftada bir yenilemek hem guvenli bir
# pay birakir hem de deponun "aktif" kalmasini saglar -- GitHub, 60 gun
# hicbir hareket olmayan depolarda zamanlanmis is akislarini durduruyor.
on:
  schedule:
    - cron: "0 4 * * 1"   # her pazartesi 07:00 TR
  workflow_dispatch:

permissions:
  contents: write   # token_expiry.json commit'i icin

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Tokeni yenile ve secret'a yaz
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Fine-grained PAT, izin: Secrets -> Read and write
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/refresh_token.py

      - name: Bitis tarihini kaydet
        if: always()
        run: |
          git config user.name  "catreels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/token_expiry.json 2>/dev/null || exit 0
          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "chore: token bitis tarihi guncellendi [skip ci]"
            git push
          fi
