name: Gunluk Reel

on:
  schedule:
    # GitHub cron UTC calisir. Turkiye = UTC+3 (yaz saati uygulanmiyor).
    #
    # Gunde 1 gonderi. minimax-h3-max-turbo ile 15sn Reel 0.15 $ tuttugu
    # icin bu siklik ayda ~4.50 $ ediyor -- 2 gunde bire gore fark kucuk,
    # gunluk yayin ise hesabin buyumesi icin belirgin sekilde daha iyi.
    - cron: "0 17 * * *"   # 20:00 TR, her gun
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece video uret, Instagram'a atma"
        type: boolean
        default: false
      backend:
        description: "Video yolu"
        type: choice
        options: [pollinations, free]
        default: pollinations
      shots:
        description: "Cekim sayisi (bos birakin = src/config.py varsayilani)"
        default: ""

# Ayni anda iki calisma olmasin: ikisi de ayni release asset'ine yazar.
concurrency:
  group: reel-publish
  cancel-in-progress: false

permissions:
  contents: write   # release asset yukleme + state/history.json commit'i

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sistem bagimliliklari
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Python bagimliliklari
        run: pip install -q -r requirements.txt

      - name: Reel uret ve yayinla
        env:
          # --- konsept metni (AI Studio ucretsiz katmani) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # --- gorsel/video ---
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # pollinations = Seedance. Bakiye yoksa kod otomatik olarak
          # ucretsiz gorsel yoluna duser, yayin durmaz.
          VIDEO_BACKEND: ${{ inputs.backend || 'pollinations' }}
          # Bos gecilirse src/config.py'deki varsayilan gecerli olur.
          REEL_SHOTS: ${{ inputs.shots }}
          # --- Instagram ---
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # --- barindirma ---
          HOST_MODE: release
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Videoyu is akisi ciktisi olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/**/reel-*.mp4
            out/**/idea.json
            out/**/caption.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Gecmisi kaydet
        if: success()
        run: |
          git config user.name  "catreels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if git diff --staged --quiet; then
            echo "gecmiste degisiklik yok"
          else
            git commit -m "chore: reel gecmisi guncellendi [skip ci]"
            git push
          fi
